[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniaia"
version = "0.1.0"
description = "A personal, local, safety-first Linux assistant powered by Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rich>=13", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
miniaIA = "miniaia.main:main"
miniaia = "miniaia.main:main"

[tool.setuptools]
packages = ["miniaia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
